[project]
name = "dictate"
version = "0.2.3-beta.1"
description = "Hold-to-talk local dictation for Windows 11, with a Fluent-styled bar above the taskbar."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "PLEXFX" }]
keywords = ["dictation", "speech-to-text", "whisper", "windows", "push-to-talk", "accessibility"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "PySide6>=6.7",
    "faster-whisper>=1.1.0",
    "huggingface-hub>=0.24",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    # CUDA support libraries for CTranslate2. Small next to a full PyTorch
    # install, which this project deliberately avoids -- faster-whisper runs on
    # CTranslate2, so torch would be ~2.5 GB of dependency for nothing.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.urls]
Homepage = "https://github.com/PLEXFX/dictate"
Repository = "https://github.com/PLEXFX/dictate"
Issues = "https://github.com/PLEXFX/dictate/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.1",
]
